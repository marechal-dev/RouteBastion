receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

  prometheus:
    config:
      scrape_configs:
        - job_name: "otel-collector"
          scrape_interval: 10s
          static_configs:
            - targets: ["otel-collector:8889"]
        # - job_name: "postgresql"
        #   static_configs:
        #     - targets: ["postgres-exporter:9187"]
        # - job_name: "redis"
        #   static_configs:
        #     - targets: ["redis-exporter:9121"]

processors:
  batch: {}

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  prometheus:
    endpoint: "0.0.0.0:8889"

  debug: {}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]

    metrics:
      receivers: [prometheus]
      processors: [batch]
      exporters: [prometheus, debug]
